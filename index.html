<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First AR App</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      #instructions {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
        z-index: 999;
        pointer-events: none;
      }
    </style>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- AR.js for A-Frame (marker-based) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <div id="instructions">
      Point your camera at a <strong>Hiro</strong> marker to see AR content.<br />
      <a
        href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png"
        target="_blank"
        style="color: #7df; text-decoration: none"
        >Print / open the Hiro marker ↗</a
      >
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    >
      <!-- Hiro marker -->
      <a-marker preset="hiro">
        <!-- Rotating colorful box -->
        <a-box
          position="0 0.5 0"
          material="color: #e74c3c; metalness: 0.3; roughness: 0.5"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
        ></a-box>

        <!-- Floating text above the box -->
        <a-text
          value="Hello, AR!"
          align="center"
          position="0 1.5 0"
          scale="1.5 1.5 1.5"
          color="#ffffff"
          animation="property: position; to: 0 1.8 0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
        ></a-text>

        <!-- Small sphere orbiting the box -->
        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear"
        >
          <a-sphere
            position="0.8 0.5 0"
            radius="0.2"
            material="color: #3498db"
          ></a-sphere>
        </a-entity>
      </a-marker>

      <!-- Camera -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
